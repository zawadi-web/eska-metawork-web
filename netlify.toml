# ============================================================
# ESKA Metalworks – Netlify Configuration
# ============================================================

[build]
  publish = "."

# ── Security & performance headers ──────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"

# ── Long-term cache for images ───────────────────────────────
[[headers]]
  for = "/uploads/gallery/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/gallery/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Long-term cache for videos (important!) ──────────────────
[[headers]]
  for = "/uploads/gallery/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

# ── Long-term cache for static assets ────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Short cache for HTML pages (always fresh) ────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Short cache for data files (gallery changes) ─────────────
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# ── Redirect www → non-www (optional) ────────────────────────
# [[redirects]]
#   from   = "https://www.eskametalworks.co.ke/*"
#   to     = "https://eskametalworks.co.ke/:splat"
#   status = 301
#   force  = true
